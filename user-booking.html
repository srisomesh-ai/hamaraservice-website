<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Book a Service - Hamara Service</title>
<!-- Old web booking page. Booking now happens in the HamaraService web app (/app/customer.html). -->
<meta http-equiv="refresh" content="3;url=/get-app.html?for=customer"/>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f8f9;color:#1a2b30;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;text-align:center}
.box{background:#fff;border-radius:16px;padding:28px 22px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
a{display:inline-block;margin-top:14px;background:#0f4c5c;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:40px">&#127968;</div>
  <h1 style="font-size:20px;margin:8px 0">Bookings are in the HamaraService app</h1>
  <p style="color:#5a6b70;font-size:14px">Bookings are made in the HamaraService Android app.</p>
  <a id="go" href="/get-app.html?for=customer">Get the app</a>
</div>
<script src="/js/hs-site.js?v=20261022"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var dest = '/app/customer.html';
  var svc = q.get('svc') || '';
  var service = q.get('service') || '';
  var opts = null;
  try { opts = JSON.parse(sessionStorage.getItem('hs_service_options') || localStorage.getItem('hs_service_options') || 'null'); } catch (e) {}
  if (opts && service && opts.service === service) {
    // Came from a service page with selected options → continue straight to the address step
    dest += '?book=1' + (/^SVC\d+$/.test(svc) ? '&svc=' + svc : '');
  } else if (/^SVC\d+$/.test(svc)) {
    dest += '?svc=' + svc;
  }
  // App-only mode (default): HS_login sends people to the customer app.
  // WEB_LOGIN_MODE='web': continue in the web app with the same booking.
  HS_login('customer', dest.replace('/app/customer.html', ''));
})();
</script>
<script src="/js/hs-track.js?v=20261022" defer></script>
</body>
</html>
