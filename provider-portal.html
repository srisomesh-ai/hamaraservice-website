<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Provider Login - Hamara Service</title>
<!-- One provider login/registration for the whole site: /app/provider.html
     (same messages and flow as the provider app). -->
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f8f9;color:#1a2b30;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;text-align:center}
.box{background:#fff;border-radius:16px;padding:28px 22px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
a{display:inline-block;margin-top:14px;background:#0f4c5c;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:40px">&#128119;</div>
  <h1 style="font-size:20px;margin:8px 0">Opening provider login…</h1>
  <a id="go" href="/app/provider.html">Continue</a>
</div>
<script>
(function(){
  var reg=/[?&]tab=register\b/.test(location.search);
  var url='/app/provider.html'+(reg?'?register=1':'');
  document.getElementById('go').href=url;
  location.replace(url);
})();
</script>
</body>
</html>
