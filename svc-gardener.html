// ── Fetch live prices from Firebase ──
(function(){
  var _DB='https://hamaraservice-s009-default-rtdb.asia-southeast1.firebasedatabase.app';
  var _API='AIzaSyDpMpewyKVlfsfSeKfoS3GJf0V_t14Qb7k';
  var _PATH='hs_service_prices/SVC032';
  var _tok='';

  function getToken(cb){
    if(_tok){cb(_tok);return;}
    var x=new XMLHttpRequest();
    x.open('POST','https://identitytoolkit.googleapis.com/v1/accounts:signInAnonymously?key='+_API,true);
    x.setRequestHeader('Content-Type','application/json');
    x.onload=function(){try{var d=JSON.parse(x.responseText);_tok=d.idToken||'';cb(_tok);}catch(e){cb('');}};
    x.onerror=function(){cb('');};
    x.send(JSON.stringify({returnSecureToken:true}));
  }

  function applyPrices(d){
    if(!d || d.error) return;
    var g=d['svc']||{};
    // Patch PRICES dict
    if(typeof PRICES!=='undefined'){
      Object.keys(g).forEach(function(k){
        if(PRICES[k]!==undefined) PRICES[k]=g[k];
      });
    }
    document.querySelectorAll('.ksvc-chip[data-svc]').forEach(function(c){
      var k=c.dataset.svc; if(g[k]===undefined) return;
      c.dataset.price=g[k];
      var pe=c.querySelector('.ksvc-price');
      if(pe){var sp=pe.querySelector('span');pe.innerHTML='₹'+parseInt(g[k]).toLocaleString('en-IN')+(sp?sp.outerHTML:'');}
    });
    if(d.base!==undefined){
      document.querySelectorAll('.pill').forEach(function(p){
        if(p.textContent.indexOf('from')>=0&&p.textContent.indexOf('₹')>=0)
          p.textContent='from ₹'+parseInt(d.base).toLocaleString('en-IN');
      });
    }
    // Recalc if anything selected
    if(typeof updatePrice==='function') updatePrice();
    if(typeof updateAll==='function') updateAll();
  }

  function load(){
    getToken(function(tok){
      var url=_DB+'/'+_PATH+'.json'+(tok?'?auth='+tok:'');
      var x=new XMLHttpRequest();
      x.open('GET',url,true);x.timeout=6000;
      x.onload=function(){try{var d=JSON.parse(x.responseText);if(d&&!d.error)applyPrices(d);}catch(e){}};
      x.onerror=function(){};
      x.send();
    });
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',load);}
  else{load();}
  setInterval(load,30000);
  window.addEventListener('storage',function(e){if(e.key==='hs_pricing_ts')load();});
})();

</script>
