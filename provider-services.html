.cnt{min-width:22px;height:22px;padding:0 6px;border-radius:20px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.cnt.has{background:#E8251A;color:#fff;}
.cnt.zero{background:#eee;color:#888;}
.chev{font-size:15px;color:#bbb;transition:transform .2s;display:inline-block;}
.chev.open{transform:rotate(90deg);}
.task-list{display:none;padding:0 10px 10px;}
.task-list.open{display:block;}
.task-block{margin-top:12px;}
.task-hdr{font-size:11px;font-weight:900;color:#E8251A;text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px;padding-bottom:4px;border-bottom:1.5px solid #fde;display:flex;align-items:center;justify-content:space-between;}
.sel-all{font-size:10px;font-weight:800;color:#E8251A;cursor:pointer;text-transform:none;letter-spacing:0;padding:2px 8px;border:1px solid #fcc;border-radius:10px;}
.var-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer;border:1.5px solid #f0f0f0;margin-bottom:5px;background:#fafafa;}
.var-row.on{background:#fff5f5;border-color:#E8251A;}
.cb{width:20px;height:20px;border:2px solid #ddd;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cb.on{background:#E8251A;border-color:#E8251A;}
.cb.on::after{content:'✓';color:#fff;font-size:12px;font-weight:900;}
.var-info{flex:1;min-width:0;}
.var-lbl{font-size:13px;font-weight:800;}
.var-desc{font-size:10px;color:#aaa;font-weight:700;margin-top:1px;}
.var-price{font-size:13px;font-weight:900;color:#E8251A;white-space:nowrap;}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid #eee;padding:12px 14px;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
.save-btn{width:100%;padding:14px;background:#E8251A;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;font-weight:800;z-index:999;display:none;white-space:nowrap;}

var adminPrices={};
function getAdminPrice(svcId, label){
  return adminPrices[svcId] && adminPrices[svcId][label] != null

}

var SERVICES=[];

// ── Utils ────────────────────────────────────────────────────────────────────
function toast(msg,dur){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},dur||3000);}
function goBack(){window.location.href='provider-dashboard.html';}
function totalSel(){return Object.values(selected).filter(Boolean).length;}
function updateBadge(){document.getElementById('totalBadge').textContent=totalSel()+' selected';}

function toggleVar(key){
  selected[key]=!selected[key];
  var row=document.getElementById('r_'+key),cb=document.getElementById('c_'+key);
  if(row)row.className='var-row'+(selected[key]?' on':'');
  if(cb)cb.className='cb'+(selected[key]?' on':'');
  SERVICES.forEach(function(g){
    var found=false;
    g.tasks.forEach(function(t){t.variants.forEach(function(v){if(v.key===key)found=true;});});
    if(found){
      var cnt=0;g.tasks.forEach(function(t){t.variants.forEach(function(v){if(selected[v.key])cnt++;});});
      var b=document.getElementById('cnt_'+g.id);
      if(b){b.textContent=cnt;b.className='cnt '+(cnt>0?'has':'zero');}
    }
  });
  updateBadge();
}

function selAll(gid,tid){
  var g=SERVICES.find(function(x){return x.id===gid;});if(!g)return;
  var t=g.tasks.find(function(x){return x.n===tid;});if(!t)return;
  var allOn=t.variants.every(function(v){return selected[v.key];});
  t.variants.forEach(function(v){
    selected[v.key]=!allOn;
    var row=document.getElementById('r_'+v.key),cb=document.getElementById('c_'+v.key);
    if(row)row.className='var-row'+(selected[v.key]?' on':'');
    if(cb)cb.className='cb'+(selected[v.key]?' on':'');
  });
  var cnt=0;g.tasks.forEach(function(t2){t2.variants.forEach(function(v){if(selected[v.key])cnt++;});});
  var b=document.getElementById('cnt_'+g.id);
  if(b){b.textContent=cnt;b.className='cnt '+(cnt>0?'has':'zero');}
  updateBadge();
}

function toggleGroup(id){
  var l=document.getElementById('tl_'+id),c=document.getElementById('ch_'+id);
  if(!l)return;var o=l.classList.contains('open');
  l.classList.toggle('open',!o);if(c)c.classList.toggle('open',!o);
}

function render(){
  var html='';
  SERVICES.forEach(function(g){
    var cnt=0,total=0;
    g.tasks.forEach(function(t){t.variants.forEach(function(v){total++;if(selected[v.key])cnt++;});});
    html+='<div class="svc-group">'
      +'<div class="svc-hdr" onclick="toggleGroup(\''+g.id+'\')">'
      +'<div class="svc-ico">'+g.icon+'</div>'
      +'<div class="svc-meta"><div class="svc-title">'+g.name+'</div>'
      +'<div class="svc-sub">'+g.cat+' &middot; '+total+' job types</div></div>'
      +'<div class="svc-right">'
      +'<span class="cnt '+(cnt>0?'has':'zero')+'" id="cnt_'+g.id+'">'+cnt+'</span>'
      +'<span class="chev" id="ch_'+g.id+'">&#9654;</span>'
      +'</div></div>'
      +'<div class="task-list" id="tl_'+g.id+'">';
    g.tasks.forEach(function(t){
      var tid=t.n.replace(/[^a-z0-9]/gi,'_');
      html+='<div class="task-block">'
        +'<div class="task-hdr">'+t.n
        +'<span class="sel-all" onclick="selAll(\''+g.id+'\',\''+t.n.replace(/'/g,"\\'")+'\')">'
        +'Select all</span></div>';
      t.variants.forEach(function(v){
        var on=!!selected[v.key];
        html+='<div class="var-row'+(on?' on':'')+'" id="r_'+v.key+'" onclick="toggleVar(\''+v.key+'\')">'
          +'<div class="cb'+(on?' on':'')+'" id="c_'+v.key+'"></div>'
          +'<div class="var-info"><div class="var-lbl">'+v.lbl+'</div>'
          +(v.desc?'<div class="var-desc">'+v.desc+'</div>':'')
          +'</div><div class="var-price">&#8377;'+v.p+'</div></div>';
      });
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('svcList').innerHTML=html;
  updateBadge();
}

function refreshPrices(){
  // Re-build services with updated admin prices then re-render
  SERVICES=buildServices();
  render();
}

function saveServices(){
  var services=[];
  SERVICES.forEach(function(g){
    g.tasks.forEach(function(t){
      t.variants.forEach(function(v){
        if(selected[v.key]){
          services.push({key:v.key,name:g.name,mainService:g.name,taskName:t.n,
            icon:g.icon,cat:g.cat,subcategory:t.n,jobType:v.lbl,
            description:v.desc||'',price:v.p,userPrice:v.p,status:'active'});
        }
      });
    });
  });
  P.services=services;
  localStorage.setItem('hs_current_provider',JSON.stringify(P));
  try{var all=JSON.parse(localStorage.getItem('hs_providers')||'[]');
    var i=all.findIndex(function(p){return p.id===P.id;});
    if(i>-1)all[i].services=services;else all.push(P);
    localStorage.setItem('hs_providers',JSON.stringify(all));
  }catch(e){}
  fetch(FB_DB+'/providers/'+P.id+'/services.json',{method:'PUT',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(services)})
    .then(function(){toast('&#10003; Saved — '+services.length+' job types',2000);setTimeout(goBack,2000);})
    .catch(function(){toast('&#10003; Saved locally',2000);setTimeout(goBack,2000);});
}

function showDebug(){
  var box=document.getElementById('dbgBox');
  box.style.display='block';
  box.textContent='Fetching hs_service_prices...';
  fetch(FB_DB+'/hs_service_prices.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      box.textContent='RAW hs_service_prices:\n'+JSON.stringify(d,null,2);
    })
    .catch(function(e){box.textContent='ERROR: '+e.message;});
}
function init(){
  try{P=JSON.parse(localStorage.getItem('hs_current_provider')||'null');}catch(e){}
  if(!P||!P.id){window.location.href='provider-portal.html';return;}
  (P.services||[]).forEach(function(s){if(s.key)selected[s.key]=true;});
  // Render immediately with hardcoded defaults
  SERVICES=buildServices();
  render();
  // Fetch catalog.json (admin's price source) to get real userPrice per service
  fetch('catalog.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(catalog){
      if(!Array.isArray(catalog)) return;
      catalog.forEach(function(s){
        if(s.id && (s.userPrice||s.defaultPrice||s.price)){
          BASE[s.id]=Number(s.userPrice||s.defaultPrice||s.price);
        }
      });
      // Also fetch hs_service_prices for any direct variant price overrides
      return fetch(FB_DB+'/hs_service_prices.json')
        .then(function(r2){return r2.json();})
        .then(function(prices){
          if(prices&&typeof prices==='object'){
            // hs_service_prices structure: {SVC001: {base:499, "1 BHK":3, "2 BHK":149, commission:10}, ...}
            Object.keys(prices).forEach(function(svcId){
              var v=prices[svcId];
              if(!v||typeof v!=='object') return;
              adminPrices[svcId]={};
              Object.keys(v).forEach(function(label){
                if(typeof v[label]==='number'){
                  if(label==='base'){
                    // base overrides the catalog base price
                    BASE[svcId]=v[label];
                  } else if(label!=='commission'&&label!=='commAmt'&&label!=='providerEarns'){
                    // option label price: "1 BHK", "2 BHK", "Daily Home" etc.
                    adminPrices[svcId][label]=v[label];
                  }
                }
              });
            });
          }
        }).catch(function(){});
    })
    .catch(function(){})
    .finally(function(){
      // Re-build with real prices and re-render
      SERVICES=buildServices();
      render();
    });
}
init();
</script>
